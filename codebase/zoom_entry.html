<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curator AI — Đang xác định vai trò Zoom</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1020;
      color: #f8fafc;
      font-family: Inter, system-ui, sans-serif;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border: 1px solid #263451;
      border-radius: 18px;
      background: #111a2f;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .3);
    }
    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      font-size: 24px;
      font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: #a7b4cc; line-height: 1.55; }
    .spinner {
      width: 24px;
      height: 24px;
      margin: 20px auto 0;
      border: 3px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .error { color: #fca5a5; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">Q</div>
    <h1>Curator AI</h1>
    <p id="zoom-entry-status">Đang nhận diện vai trò của bạn trong Zoom Meeting…</p>
    <div id="zoom-entry-spinner" class="spinner" aria-hidden="true"></div>
  </main>
  <script src="https://appssdk.zoom.us/sdk.js"></script>
  <script src="/zoom_entry.js"></script>
</body>
</html>
