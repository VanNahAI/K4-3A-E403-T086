<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đã thêm Curator AI vào Zoom</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e2e8f0; }
    main { width: min(480px, calc(100% - 40px)); padding: 32px; border: 1px solid #24324a; border-radius: 18px; background: #111b2e; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: #10b981; font-size: 28px; }
    h1 { margin: 20px 0 10px; font-size: 24px; }
    p { color: #94a3b8; line-height: 1.6; }
    strong { color: #f8fafc; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>Đã thêm Curator AI thành công</h1>
    <p>Quay lại <strong>Zoom Workplace</strong>, vào Meeting rồi chọn <strong>Apps → My Apps → General app 984</strong>. Ứng dụng sẽ tự hiển thị giao diện Host hoặc Học viên theo vai trò trong Meeting.</p>
  </main>
</body>
</html>
